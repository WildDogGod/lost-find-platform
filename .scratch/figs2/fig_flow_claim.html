<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden;background:#fff}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1320" viewBox="0 0 1400 1320"><defs><marker id="ah" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#5A6472"/></marker></defs><rect width="1400" height="1320" fill="#FFFFFF"/><rect x="330" y="24" width="180" height="56" rx="8" fill="#EAF5EF" stroke="#2E7D5B" stroke-width="2"/><text x="420.0" y="59.2" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" fill="#2E7D5B" text-anchor="middle" font-weight="normal">开始</text><polyline points="420,80 420,106" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="120.0" y="106" width="600" height="68" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="420.0" y="146.48" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">申请人在物品详情页点击“我要认领”，填写认领凭证描述</text><polyline points="420,174 420,200" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="120.0" y="200" width="600" height="84" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="420.0" y="234.53" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">校验：已登录且账号正常；物品状态为 ACTIVE；申请人不是发布者；</text><text x="420.0" y="262.43" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">该物品下无本人待审申请</text><polyline points="420,284 420,310" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><polygon points="420,314 572,372 420,430 268,372" fill="#EAF1F9" stroke="#B4611E" stroke-width="2"/><text x="420" y="378.46" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="19" fill="#1F3B57" text-anchor="middle" font-weight="normal">满足认领条件？</text><polyline points="420,430 420,462" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="120.0" y="462" width="600" height="84" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="420.0" y="496.53000000000003" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">创建 claim 记录（status = PENDING，claim_desc = 凭证描述），</text><text x="420.0" y="524.4300000000001" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">item 状态由 ACTIVE 置为 PROCESSING</text><polyline points="420,546 420,574" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="120.0" y="574" width="600" height="62" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="420.0" y="611.48" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">写入 message 表，通知发布者“收到新的认领申请”</text><polyline points="420,636 420,664" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="120.0" y="664" width="600" height="84" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="420.0" y="698.53" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">发布者（或管理员）在“收到的申请”中查看凭证，核对隐藏特征，</text><text x="420.0" y="726.43" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">作出审核结论：通过 / 驳回，并填写审核备注</text><polyline points="420,748 420,776" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><polygon points="420,782 570,838 420,894 270,838" fill="#EAF1F9" stroke="#B4611E" stroke-width="2"/><text x="420" y="844.46" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="19" fill="#1F3B57" text-anchor="middle" font-weight="normal">审核通过？</text><polyline points="420,894 420,926" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="120.0" y="926" width="600" height="88" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="420.0" y="962.53" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">claim 置为 APPROVED、review_time = 当前时间；</text><text x="420.0" y="990.43" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">item 置为 COMPLETED；同一物品其他待审申请自动 REJECTED</text><polyline points="420,1014 420,1042" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="120.0" y="1042" width="600" height="84" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="420.0" y="1076.53" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">写入 message 表通知申请人认领成功及其他申请人申请已关闭，</text><text x="420.0" y="1104.43" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">物品从列表“可认领”集合中移除</text><polyline points="420,1126 420,1154" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="270" y="1154" width="300" height="56" rx="8" fill="#EAF5EF" stroke="#2E7D5B" stroke-width="2"/><text x="420.0" y="1188.48" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#2E7D5B" text-anchor="middle" font-weight="normal">结束（物品归还失主）</text><polyline points="572,372 700,372" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><text x="586" y="358" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#5A6472" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">否</text><rect x="710" y="320" width="620" height="110" rx="8" fill="#FBEFEE" stroke="#9A3B33" stroke-width="2"/><text x="1020.0" y="355.96" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#9A3B33" text-anchor="middle" font-weight="normal">直接拒绝并返回原因：物品已被认领 / 不可认领、</text><text x="1020.0" y="380.76" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#9A3B33" text-anchor="middle" font-weight="normal">不能认领自己发布的信息、已有待审申请</text><text x="1020.0" y="405.56" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#9A3B33" text-anchor="middle" font-weight="normal">流程返回物品详情页，本次申请不落库</text><polyline points="570,838 700,838" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><text x="584" y="824" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#5A6472" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">否</text><rect x="710" y="772" width="620" height="136" rx="8" fill="#FBEFEE" stroke="#9A3B33" stroke-width="2"/><text x="1020.0" y="820.96" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#9A3B33" text-anchor="middle" font-weight="normal">claim 置为 REJECTED，review_remark 记录驳回原因；</text><text x="1020.0" y="845.76" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#9A3B33" text-anchor="middle" font-weight="normal">item 恢复为 ACTIVE 可重新被认领；</text><text x="1020.0" y="870.5600000000001" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#9A3B33" text-anchor="middle" font-weight="normal">通知申请人驳回结果，等待其他申请人发起</text></svg></body></html>
