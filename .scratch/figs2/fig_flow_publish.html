<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden;background:#fff}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1260" viewBox="0 0 1220 1260"><defs><marker id="ah" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#5A6472"/></marker></defs><rect width="1220" height="1260" fill="#FFFFFF"/><rect x="360" y="24" width="180" height="56" rx="8" fill="#EAF5EF" stroke="#2E7D5B" stroke-width="2"/><text x="450.0" y="59.2" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" fill="#2E7D5B" text-anchor="middle" font-weight="normal">开始</text><polyline points="450,80 450,108" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="170.0" y="108" width="560" height="62" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="450.0" y="145.48" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">用户点击“发布失物 / 招领”，进入发布页面</text><polyline points="450,170 450,198" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="170.0" y="198" width="560" height="84" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="450.0" y="232.53" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">填写发布表单：类型（失物 / 招领）、标题、分类、描述、</text><text x="450.0" y="260.43" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">发生时间、地点、隐藏特征、联系人及电话</text><polyline points="450,282 450,310" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="170.0" y="310" width="560" height="84" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="450.0" y="344.53000000000003" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">选择本地图片，前端校验格式（jpg / png / webp）</text><text x="450.0" y="372.43" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">与单张大小（≤ 5MB）、最多 3 张</text><polyline points="450,394 450,422" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="170.0" y="422" width="560" height="62" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="450.0" y="459.48" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">调用上传接口，图片写入 OSS 并返回访问 URL</text><polyline points="450,484 450,512" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><polygon points="450,514 600,570 450,626 300,570" fill="#EAF1F9" stroke="#B4611E" stroke-width="2"/><text x="450" y="576.46" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="19" fill="#1F3B57" text-anchor="middle" font-weight="normal">表单校验通过？</text><polyline points="450,626 450,660" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="170.0" y="660" width="560" height="62" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="450.0" y="697.48" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">提交 POST /api/items，请求头携带 JWT 令牌</text><polyline points="450,722 450,750" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="170.0" y="750" width="560" height="84" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="450.0" y="784.53" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">后端校验登录态与角色、必填项与长度、图片 URL 合法性与</text><text x="450.0" y="812.43" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">发布频率，并按“类型 + 分类 + 关键词”生成匹配候选</text><polyline points="450,834 450,862" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><polygon points="450,864 600,920 450,976 300,920" fill="#EAF1F9" stroke="#B4611E" stroke-width="2"/><text x="450" y="926.46" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="19" fill="#1F3B57" text-anchor="middle" font-weight="normal">校验通过？</text><polyline points="450,976 450,1010" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="170.0" y="1010" width="560" height="84" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="450.0" y="1044.53" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">写入 item 表：status = PENDING、user_id = 发布者、</text><text x="450.0" y="1072.43" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">create_time = 当前时间，返回统一 Result 结果</text><polyline points="450,1094 450,1122" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="170.0" y="1122" width="560" height="62" rx="8" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2"/><text x="450.0" y="1159.48" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#1F3B57" text-anchor="middle" font-weight="normal">页面提示“提交成功，等待管理员审核”，跳转“我的发布”</text><polyline points="450,1184 450,1204" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="330" y="1204" width="240" height="52" rx="8" fill="#EAF5EF" stroke="#2E7D5B" stroke-width="2"/><text x="450.0" y="1236.48" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#2E7D5B" text-anchor="middle" font-weight="normal">结束（待审核）</text><polyline points="620,570 750,570" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><text x="634" y="556" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#5A6472" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">否</text><rect x="775" y="512" width="400" height="116" rx="8" fill="#FBEFEE" stroke="#9A3B33" stroke-width="2"/><text x="975.0" y="552.15" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#9A3B33" text-anchor="middle" font-weight="normal">前端提示错误并高亮对应字段</text><text x="975.0" y="575.4" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#9A3B33" text-anchor="middle" font-weight="normal">（如“请选择物品分类”）</text><text x="975.0" y="598.65" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#9A3B33" text-anchor="middle" font-weight="normal">返回表单修改后重新提交</text><polyline points="620,920 750,920" fill="none" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><text x="634" y="906" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#5A6472" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">否</text><rect x="775" y="862" width="400" height="116" rx="8" fill="#FBEFEE" stroke="#9A3B33" stroke-width="2"/><text x="975.0" y="902.15" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#9A3B33" text-anchor="middle" font-weight="normal">返回 Result(code≠200) 与错误描述</text><text x="975.0" y="925.4" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#9A3B33" text-anchor="middle" font-weight="normal">已填内容保留在表单中</text><text x="975.0" y="948.65" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#9A3B33" text-anchor="middle" font-weight="normal">修改后重新提交</text></svg></body></html>
